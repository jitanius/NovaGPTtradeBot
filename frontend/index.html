<!doctype html>
<html lang="ru" translate="no">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ENOS NOVA</title><link rel="stylesheet" href="styles.css">
<script src="vendor/lightweight-charts.standalone.production.js"></script>
</head>
<body><div id="app">
<header class="top"><div class="brand"><span class="logo">AK</span><div><b>ENOS NOVA</b><small>TRADING INTELLIGENCE PLATFORM</small></div></div><div class="motto">ANALYZE · STRATEGIZE · EVOLVE</div><div class="top-actions"><div id="langs" class="langs"><button data-lang="ru">РУ</button><button data-lang="en">EN</button><button data-lang="he">עב</button></div><div class="research-pill">⌕ <span data-i18n="research_os">Исследовательская ОС · локально</span></div><div class="paper-badge"><b data-i18n="paper_mode">РЕЖИМ БУМАГИ</b><small data-i18n="paper_sub">Реальные рыночные данные · виртуальный капитал</small></div></div></header>
<div id="topTickers" class="tickerbar"></div>
<div class="layout"><aside id="sidebar" class="sidebar"></aside><main id="workspace" class="workspace"></main></div>
<div id="marketModal" class="modal hidden"><div class="modal-card"><div class="modal-head"><b data-i18n="markets">РЫНКИ</b><button id="closeMarket">×</button></div><input id="marketSearch" placeholder="BTC, NVDA, AAPL..."><div id="marketTabs" class="tabs"></div><div id="marketList" class="market-list"></div></div></div>
<div id="toast" class="toast hidden"></div></div>
<script src="i18n.js"></script><script src="chart.js"></script><script src="app.js"></script>
</body></html>
